name: Feature request
description: Suggest an improvement or new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, please check the [ROADMAP](../../ROADMAP.md) and
        the existing issues — your idea may already be planned or
        under discussion.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case and why the current behavior
        falls short.
      placeholder: I'm trying to do X, but Voqi currently does Y, which
        means I have to work around it by Z.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see Voqi do? Sketch the API
        or UX if you have one in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you'd
        prefer this one.
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Which part of Voqi would this touch?
      options:
        - Widget (browser)
        - Agent server (Python)
        - Tool registry / API surface
        - Docs / examples
        - Multiple / not sure
    validations:
      required: true

  - type: checkboxes
    id: contribution
    attributes:
      label: Are you planning to contribute this?
      options:
        - label: I'm willing to open a PR for this.
          required: false
